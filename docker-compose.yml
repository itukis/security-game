services:
  sqli-login:
    build:
      context: ./packages/vulnerable-apps/sqli-login
    container_name: arena-sqli-login
    ports:
      - "3001:3000"
    networks:
      - vuln-net
    cap_add:
      - NET_ADMIN
    tmpfs:
      - /tmp:size=10M
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  xss-comments:
    build:
      context: ./packages/vulnerable-apps/xss-comments
